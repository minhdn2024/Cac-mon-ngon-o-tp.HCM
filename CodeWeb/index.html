<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các món ăn ngon ở TP.HCM</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JavaScript/script.js" defer></script>
</head>

<body onload="addTabFocus()">

    <main>
        <div id="image" aria-live="polite">
            Hover over an Image to Display the Alt Text
        </div>

        <div class="gallery">
            <img src="images/photo1.jpg"
                 alt="Cơm tấm Sài Gòn"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images/photo2.jpg"
                 alt="Bánh mì"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images/photo3.jpg"
                 alt="Hủ tiếu Nam Vang"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images/photo4.jpg"
                 alt="Phá lấu bò"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images/photo5.jpg"
                 alt="Sủi cảo"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">

            <img src="images/photo6.jpg"
                 alt="Ốc luộc"
                 onmouseover="upDate(this)"
                 onmouseleave="unDo()"
                 onfocus="upDate(this)"
                 onblur="unDo()">
        </div>

    </main>

</body>
</html>
